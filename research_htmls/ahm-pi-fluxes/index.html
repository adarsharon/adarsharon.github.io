const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (u) => btoa(String.fromCharCode(...u));
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, 256);
  return new Uint8Array(bits);
}
async function decryptPage(raw) {  // raw AES key bytes -> page HTML; throws on a wrong key
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}


const STORE = "research-key:ahm-pi-fluxes";
function show(html) {
  document.open(); document.write(html); document.close();
  if (location.hash) setTimeout(() => { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); }, 60);
}
async function tryStored() {
  let raw = null;
  try { raw = localStorage.getItem(STORE); } catch (_) {}
  if (!raw) return;
  try { show(await decryptPage(b64(raw))); } catch (_) { try { localStorage.removeItem(STORE); } catch (_) {} }
}
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("go");
  btn.disabled = true; msg.textContent = "Checking\u2026";
  try {
    const raw = await keyFromPassword(document.getElementById("pw").value.trim());
    const html = await decryptPage(raw);
    if (document.getElementById("rem").checked) { try { localStorage.setItem(STORE, toB64(raw)); } catch (_) {} }
    show(html);
  } catch (_) {
    msg.textContent = "Wrong password."; btn.disabled = false;
  }
});
tryStored();
