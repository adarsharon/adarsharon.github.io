<!doctype html>

<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,450;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  /* colours and fonts of adarsharon.com (styles.css) */
  :root {
    --paper: #f8f7f3;
    --ink: #253438;
    --ink2: #394c50;
    --muted: #646f6d;
    --line: #dbdfda;
    --line-dark: #bac7c0;
    --orange: #ad6a49;
    --orange-text: #a16244;
    --green: #46615c;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  ::selection { background: #d8c6b8; color: var(--ink); }
  .page { max-width: 1040px; margin: 0 auto; padding: 18px 28px 90px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--green); font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
  .eyebrow-line { display: inline-block; height: 1px; width: 29px; background: var(--orange); }
  .eyebrow:hover { color: var(--ink); }
  h1 { font: 450 clamp(36px, 4vw, 48px)/1.05 var(--serif); letter-spacing: -.04em; margin: 8px 0 4px; }
  h1 .period { color: var(--orange); }
  .status { color: var(--muted); font-size: 14px; margin: 0; }
  .new-count { color: var(--orange-text); font-weight: 700; }
  .section { margin-top: 26px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 20px; flex-wrap: wrap; padding-bottom: 7px; border-bottom: 1px solid var(--line-dark); }
  .section-head h2 { font: 450 26px/1.1 var(--serif); letter-spacing: -.02em; margin: 0; }
  .count { font: 500 14px var(--sans); letter-spacing: 0; color: var(--muted); margin-left: 12px; }
  .count em { font-style: normal; font-weight: 700; color: var(--orange-text); }
  .head-links { display: flex; gap: 22px; font-size: 14px; font-weight: 600; color: var(--ink2); }
  .head-links a { transition: color .2s; }
  .head-links a span { color: var(--orange); }
  .head-links a:hover { color: var(--orange); }
  .list { list-style: none; margin: 0; padding: 0; }
  .item { border-bottom: 1px solid var(--line); padding: 9px 12px 10px; }
  .item.new { box-shadow: inset 3px 0 0 var(--orange); }
  .item-top { display: flex; align-items: baseline; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .paper-id { color: var(--green); font-weight: 600; font-size: 13px; }
  .date { font-variant-numeric: tabular-nums; }
  .new-label { color: var(--orange-text); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .title { display: block; color: var(--orange-text); font-weight: 600; font-size: 16px; line-height: 1.35; margin: 2px 0 3px; }
  .title:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  /* not yet opened: orange titles; already opened: ink titles and grey arXiv numbers */
  .title:visited { color: var(--ink); }
  .paper-id:visited { color: var(--muted); }
  .authors { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .authors strong { color: var(--ink); font-weight: 600; }
  .cite { display: flex; align-items: baseline; gap: 16px; padding: 6px 12px; }
  .cite .date { flex: none; font-size: 12.5px; color: var(--muted); }
  .cite-body { min-width: 0; }
  .cite .new-label { margin-right: 10px; }
  .cite .title { display: inline; font-size: 15px; margin: 0 10px 0 0; }
  .cite .authors { display: inline; font-size: 13.5px; }
  .empty { color: var(--muted); font-style: italic; padding: 16px 12px; margin: 0; }
  @media (max-width: 700px) {
    .page { padding: 14px 16px 70px; }
    .section { margin-top: 22px; }
    .section-head h2 { font-size: 24px; }
    .item { padding: 8px 6px 9px; }
    .cite { padding: 6px 6px; }
  }
</style>
</head>
<body>
<main class="page">
<header>
<a class="eyebrow" href="/"><span class="eyebrow-line"></span>adarsharon.com</a>
<h1>New papers<span class="period">.</span></h1>
<p class="status" id="status">Fetching from INSPIRE&hellip;</p>
</header>
<div id="results"></div>
</main>
<script src="/projects/arxiv/arxiv_tracker.js?v=5"></script>
</body>
</html>
